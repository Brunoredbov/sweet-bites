# Banco PostgreSQL para desenvolvimento local: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sweetbites
      POSTGRES_USER: sweetbites
      POSTGRES_PASSWORD: sweetbites
    ports:
      - "5433:5432"
    volumes:
      - sweetbites-dados:/var/lib/postgresql/data
volumes:
  sweetbites-dados:
