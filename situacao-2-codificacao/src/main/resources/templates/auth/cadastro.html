<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Criar conta')}"></head>
<body>
<main class="auth">
    <div class="auth-cartao">
        <div class="auth-marca">
            <h1>Criar conta</h1>
            <p>Leva menos de um minuto</p>
        </div>

        <form th:action="@{/cadastro}" th:object="${form}" method="post" novalidate>
            <div class="campo" th:classappend="${#fields.hasErrors('nome')} ? 'invalido'">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" th:field="*{nome}" autocomplete="name" required maxlength="120">
                <span class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:text="${#fields.errors('nome')[0]}"></span>
            </div>
            <div class="campo" th:classappend="${#fields.hasErrors('email')} ? 'invalido'">
                <label for="email">E-mail</label>
                <input type="email" id="email" th:field="*{email}" autocomplete="email" required maxlength="160">
                <span class="erro-campo" th:if="${#fields.hasErrors('email')}" th:text="${#fields.errors('email')[0]}"></span>
            </div>
            <div class="campo" th:classappend="${#fields.hasErrors('telefone')} ? 'invalido'">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" th:field="*{telefone}" autocomplete="tel" placeholder="(11) 91234-5678" required>
                <span class="erro-campo" th:if="${#fields.hasErrors('telefone')}" th:text="${#fields.errors('telefone')[0]}"></span>
            </div>
            <div class="campo" th:classappend="${#fields.hasErrors('senha')} ? 'invalido'">
                <label for="senha">Senha</label>
                <input type="password" id="senha" th:field="*{senha}" autocomplete="new-password" required>
                <div class="ajuda">Mínimo de 8 caracteres, com letras e números.</div>
                <span class="erro-campo" th:if="${#fields.hasErrors('senha')}" th:text="${#fields.errors('senha')[0]}"></span>
            </div>
            <div class="campo" th:classappend="${#fields.hasErrors('confirmarSenha')} ? 'invalido'">
                <label for="confirmarSenha">Confirmar senha</label>
                <input type="password" id="confirmarSenha" th:field="*{confirmarSenha}" autocomplete="new-password" required>
                <span class="erro-campo" th:if="${#fields.hasErrors('confirmarSenha')}" th:text="${#fields.errors('confirmarSenha')[0]}"></span>
            </div>
            <button type="submit" class="botao botao-bloco">Criar conta</button>
        </form>

        <p class="rodape-auth">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </div>
</main>
</body>
</html>
