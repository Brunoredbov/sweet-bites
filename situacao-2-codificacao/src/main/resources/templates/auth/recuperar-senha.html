<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Recuperar senha')}"></head>
<body>
<main class="auth">
    <div class="auth-cartao">
        <div class="auth-marca">
            <h1>Esqueci minha senha</h1>
            <p>Enviaremos um link para redefinir sua senha</p>
        </div>

        <div class="painel-branco" th:if="${enviado}">
            <div class="alerta alerta-sucesso" role="status">
                Se houver uma conta com esse e-mail, enviamos um link de redefinição. Ele vale por 1 hora.
            </div>
            <div class="alerta alerta-demo" th:if="${modoDemonstracao and tokenDemonstracao != null}">
                <strong>Modo demonstração:</strong> o envio de e-mail é simulado. Use o link abaixo:<br>
                <a th:href="@{/redefinir-senha(token=${tokenDemonstracao})}">Redefinir minha senha</a>
            </div>
            <a th:href="@{/login}" class="botao botao-bloco botao-secundario">Voltar para o login</a>
        </div>

        <form th:unless="${enviado}" th:action="@{/recuperar-senha}" method="post" novalidate>
            <div class="alerta alerta-erro" role="alert" th:if="${erro}" th:text="${erro}"></div>
            <div class="campo">
                <label for="email">E-mail cadastrado</label>
                <input type="email" id="email" name="email" autocomplete="email" required autofocus>
            </div>
            <button type="submit" class="botao botao-bloco">Enviar link</button>
        </form>

        <p class="rodape-auth"><a th:href="@{/login}">Voltar para o login</a></p>
    </div>
</main>
</body>
</html>
