<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorias')}"></head>
<body class="admin">
<header th:replace="~{fragments/layout :: topoAdmin('categorias')}"></header>
<div th:replace="~{fragments/layout :: mensagens}"></div>
<main class="admin-conteudo">
    <h1>Categorias</h1>
    <form class="painel-branco filtros" th:action="@{/admin/categorias}" th:object="${form}" method="post" novalidate>
        <div class="campo" th:classappend="${#fields.hasErrors('nome')} ? 'invalido'">
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" maxlength="60" required>
            <span class="erro-campo" th:errors="*{nome}"></span>
        </div>
        <div class="campo">
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" th:field="*{descricao}" maxlength="255">
        </div>
        <button type="submit" class="botao">Adicionar categoria</button>
    </form>
    <div class="painel-branco tabela-container">
        <table>
            <thead><tr><th>Nome</th><th>Descrição</th><th></th></tr></thead>
            <tbody>
            <tr th:each="c : ${categorias}">
                <td th:text="${c.nome}">nome</td>
                <td th:text="${c.descricao}">desc</td>
                <td>
                    <form th:action="@{/admin/categorias/{id}/remover(id=${c.id})}" method="post"
                          th:attr="data-confirmar='Remover a categoria ' + ${c.nome} + '?'">
                        <button type="submit" class="botao botao-pequeno botao-perigo">Remover</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
