<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FF6B8A">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <meta name="usuario-id" th:if="${usuario != null}" th:content="${usuario.id}">
    <title th:text="${titulo} + ' · Sweet Bites'">Sweet Bites</title>
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<!-- Cabeçalho da loja (cliente) -->
<header th:fragment="topo(titulo)" class="topo">
    <a th:href="@{/}" class="topo-logo" aria-label="Sweet Bites - início">
        <img th:src="@{/favicon.svg}" alt="" width="32" height="32">
        <span>Sweet Bites</span>
    </a>
    <div class="topo-acoes">
        <a th:href="@{/notificacoes}" class="icone-botao" aria-label="Notificações">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3a1.5 1.5 0 0 0-3 0v1.16A7 7 0 0 0 5 11v5l-2 2v1h18v-1Z"/></svg>
            <span class="badge" th:if="${notificacoesNaoLidas > 0}" th:text="${notificacoesNaoLidas}">1</span>
        </a>
        <a th:href="@{/carrinho}" class="icone-botao" aria-label="Carrinho">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM5.2 4l.9 2H20a1 1 0 0 1 .9 1.45l-3.4 6.5a2 2 0 0 1-1.76 1.05H8.1l-.9 1.6V17h12v-2H8.4l.6-1h7.7l3.6-7H6.6L5.4 2H2v2Z"/></svg>
            <span class="badge" data-contador-carrinho hidden>0</span>
        </a>
    </div>
</header>

<!-- Mensagens de sucesso/erro (flash) -->
<div th:fragment="mensagens" class="mensagens">
    <div class="alerta alerta-sucesso" role="status" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alerta alerta-erro" role="alert" th:if="${erro}" th:text="${erro}"></div>
</div>

<!-- Navegação inferior (mapa navegacional do PIT I) -->
<nav th:fragment="nav(ativo)" class="nav-inferior" aria-label="Navegação principal">
    <a th:href="@{/}" th:classappend="${ativo == 'inicio'} ? 'ativo'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 2 11h3v9h6v-6h2v6h6v-9h3Z"/></svg>
        <span>Início</span>
    </a>
    <a th:href="@{/pedidos}" th:classappend="${ativo == 'pedidos'} ? 'ativo'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Zm-2 14H7v-2h10Zm0-4H7v-2h10Zm0-4H7V7h10Z"/></svg>
        <span>Pedidos</span>
    </a>
    <a th:href="@{/carrinho}" th:classappend="${ativo == 'carrinho'} ? 'ativo'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM5.2 4l.9 2H20a1 1 0 0 1 .9 1.45l-3.4 6.5a2 2 0 0 1-1.76 1.05H8.1l-.9 1.6V17h12v-2H8.4l.6-1h7.7l3.6-7H6.6L5.4 2H2v2Z"/></svg>
        <span>Carrinho</span>
    </a>
    <a th:href="@{/perfil}" th:classappend="${ativo == 'perfil'} ? 'ativo'">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.42 0-8 2.24-8 5v2h16v-2c0-2.76-3.58-5-8-5Z"/></svg>
        <span>Perfil</span>
    </a>
    <a th:if="${usuario != null and usuario.admin}" th:href="@{/admin}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5ZM13 15.5A3.5 3.5 0 1 1 16.5 12 3.5 3.5 0 0 1 13 15.5Z"/></svg>
        <span>Admin</span>
    </a>
</nav>

<!-- Cabeçalho do painel administrativo -->
<header th:fragment="topoAdmin(ativo)" class="topo topo-admin">
    <a th:href="@{/admin}" class="topo-logo">
        <img th:src="@{/favicon.svg}" alt="" width="28" height="28">
        <span>Sweet Bites · Admin</span>
    </a>
    <nav class="admin-menu" aria-label="Menu administrativo">
        <a th:href="@{/admin}" th:classappend="${ativo == 'painel'} ? 'ativo'">Painel</a>
        <a th:href="@{/admin/pedidos}" th:classappend="${ativo == 'pedidos'} ? 'ativo'">Pedidos</a>
        <a th:href="@{/admin/cupcakes}" th:classappend="${ativo == 'cupcakes'} ? 'ativo'">Cupcakes</a>
        <a th:href="@{/admin/estoque}" th:classappend="${ativo == 'estoque'} ? 'ativo'">Estoque</a>
        <a th:href="@{/admin/categorias}" th:classappend="${ativo == 'categorias'} ? 'ativo'">Categorias</a>
        <a th:href="@{/}">Ver loja</a>
        <form th:action="@{/logout}" method="post" class="inline">
            <button type="submit" class="link-botao">Sair</button>
        </form>
    </nav>
</header>

</body>
</html>
