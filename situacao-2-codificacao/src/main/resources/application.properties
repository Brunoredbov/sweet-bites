spring.application.name=sweet-bites
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.timeout=60m
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework
server.tomcat.max-swallow-size=20MB

# Banco de dados (PostgreSQL). Em produção, defina DATABASE_URL / DATABASE_USER / DATABASE_PASSWORD.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/sweetbites}
spring.datasource.username=${DATABASE_USER:sweetbites}
spring.datasource.password=${DATABASE_PASSWORD:sweetbites}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Upload de imagens. A regra de negócio (US-14: JPG/PNG até 5MB) é validada pelo ImagemValidator,
# com mensagem amigável; o limite do servidor fica acima disso só como proteção.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Administrador inicial (criado no primeiro boot, se ainda não existir)
loja.admin.email=${ADMIN_EMAIL:}
loja.admin.senha=${ADMIN_SENHA:}

# Modo demonstração: mostra o link de recuperação de senha na tela (e-mail é simulado)
# e o botão "Simular pagamento" do PIX.
loja.modo-demonstracao=${MODO_DEMONSTRACAO:true}

# Frete por zona (US-08 / US-10). Loja em São Paulo/SP.
loja.cidade=S\u00e3o Paulo
loja.uf=SP
loja.frete.cidade.valor=7.00
loja.frete.cidade.tempo-min=45
loja.frete.estado.valor=15.00
loja.frete.estado.tempo-min=120
